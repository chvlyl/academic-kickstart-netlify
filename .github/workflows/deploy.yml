name: Deploy to GitHub Pages

on:
  push:
    branches: [astro-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Check, build, and upload static site
        uses: withastro/action@v6.1.3
        with:
          node-version: 24
          build-cmd: npm run check && npm run build
        env:
          PAGES_SITE: ${{ steps.pages.outputs.origin }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
